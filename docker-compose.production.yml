services:
  lotm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    image: lotm:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - lotm_data:/app/data
    networks:
      - web

  cards-mcp:
    image: lotm:latest
    restart: unless-stopped
    env_file: .env
    environment:
      CARDS_MCP_HOST: 0.0.0.0
    command: npm run cards:mcp:http
    volumes:
      - lotm_data:/app/data
    networks:
      - web

networks:
  web:
    external: true
    name: stack_web

volumes:
  lotm_data:
